# hand-assembled from the output of the vunnel "ocamlsec" provider (anchore/vunnel#1458),
# run on the generated-osv branch of https://github.com/ocaml/security-advisories as of
# 2026-11-19; the provider is not in a published vunnel cache yet
auto-generate: false
extractions:
  ocamlsec:
    # ocaml {>= "4.04" & < "4.04.2"}: range [4.04.0, 4.04.2)
    - osec-2017-01
    # ocaml {< "4.14.3" | >= "5" & < "5.4.1"}: ranges < 4.14.3 and [5.0.0, 5.4.1)
    - osec-2026-01
    # GIT ranges only, no opam package
    - osec-2026-28
