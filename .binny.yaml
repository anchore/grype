# only pull in version updates that were released more than a week ago (low-pass filter for quickly-retracted releases)
cooldown: 7d
# note: we inherit tool definitions from anchore/go-make's embedded .binny.yaml, so we only
# need to specify tools here that are not already defined there (or that we want to override
# with different versions).
tools:
  # used for integration tests
  - name: skopeo
    version:
      want: v1.24.1
    method: go-install
    with:
      module: github.com/containers/skopeo
      entrypoint: cmd/skopeo
      args:
        - "-tags"
        - containers_image_openpgp
      env:
        - CGO_ENABLED=0
        - GO_DYN_FLAGS=""

  # used in the quality gate to compare grype from this checkout with the latest release
  - name: yardstick
    version:
      # a main commit until the Go yardstick is released
      want: b17b35f534ccb72c1fa89fd5579d022a4d140bae
    method: go-install
    with:
      module: github.com/anchore/yardstick
      entrypoint: cmd/yardstick
      env:
        # the python-era tags (latest v0.16.2) cannot be zipped by the go proxy, so the sumdb has no
        # entry for them and go install fails its deprecation lookup. GOPRIVATE skips the sumdb and
        # fetches straight from github at the pinned SHA instead. Drop this once v0.17.0 is tagged.
        - GOPRIVATE=github.com/anchore/yardstick
